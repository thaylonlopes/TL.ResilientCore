name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET 9
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore Dependencies with CPM
      run: dotnet restore TL.ResilientCore.sln

    - name: Build Solution (Release)
      run: dotnet build TL.ResilientCore.sln -c Release --no-restore

    - name: Run Unit Tests
      run: dotnet test tests/TL.ResilientCore.UnitTests/TL.ResilientCore.UnitTests.csproj -c Release --no-build --verbosity normal

    - name: Run Architecture Tests
      run: dotnet test tests/TL.ResilientCore.ArchitectureTests/TL.ResilientCore.ArchitectureTests.csproj -c Release --no-build --verbosity normal
