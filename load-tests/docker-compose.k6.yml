services:
  k6:
    image: grafana/k6:latest
    container_name: tl-resilientcore-k6
    volumes:
      - ./k6-config.js:/scripts/k6-config.js:ro
    environment:
      - API_URL=${API_URL:-http://host.docker.internal:5000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: run /scripts/k6-config.js

